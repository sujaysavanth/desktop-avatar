<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Everything is local now (the rig replaced the CDN-loaded Live2D), so we
         can lock this down properly and silence Electron's CSP warning. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src ws://127.0.0.1:8765" />
    <title>desk-avatar</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- #world spans every display. Nothing in here is visible except the
         character itself — the rest of the window is transparent and click-through. -->
    <div id="world">
      <!-- #avatar is exactly the character's box. Its size is set from the loaded
           character definition, and it carries both the position translate and
           the surface rotation (90° on a wall, 180° on the ceiling). -->
      <div id="avatar">
        <!-- speech + chat stack upward from above the head -->
        <div id="panel">
          <div id="bubble" class="hidden"></div>
          <div id="chat" class="hidden">
            <input id="msg" type="text" placeholder="talk to me…" autocomplete="off" />
            <button id="send" title="send">➤</button>
            <button id="quit" title="quit (Ctrl+Alt+Q)">✕</button>
          </div>
        </div>

        <span id="state-dot" class="idle" title="idle"></span>

        <!-- The rig is injected by character.js from the chosen definition in
             characters/. Empty on purpose — nothing here is character-specific. -->
        <svg id="char" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>

    <!-- character definitions must register before the driver loads one -->
    <script src="characters/chibi.js"></script>
    <script src="characters/spider.js"></script>

    <script src="character.js"></script>
    <script src="behavior.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
